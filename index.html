<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="School of Growth Global is a digital institution for leadership, business transformation, mentorship, career growth, and lifelong learning."
    />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/sgg-apple-touch-180-v1.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script id="pwa-install-bootstrap">
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.sggInstallPrompt = event;
      });
      window.addEventListener('appinstalled', () => {
        window.sggInstallPrompt = null;
        window.sggAppInstalled = true;
      });
    </script>
    <style id="app-launch-styles">
      #app-launch-screen {
        position: fixed;
        inset: 0;
        background: #000000;
        display: grid;
        place-items: center;
      }
      #app-launch-screen img {
        display: block;
        width: min(88vw, 320px);
        height: auto;
        max-height: 60vh;
        max-height: 60dvh;
        object-fit: contain;
      }
    </style>
    <link rel="canonical" href="https://schoolofgrowthglobal.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="School of Growth Global" />
    <meta property="og:title" content="School of Growth Global" />
    <meta
      property="og:description"
      content="Leadership, business transformation, mentorship, career growth, and lifelong learning for ambitious students, professionals, entrepreneurs, and executives."
    />
    <meta property="og:url" content="https://schoolofgrowthglobal.vercel.app/" />
    <meta property="og:image" content="https://schoolofgrowthglobal.vercel.app/meta/og-home.png" />
    <meta property="og:image:secure_url" content="https://schoolofgrowthglobal.vercel.app/meta/og-home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="School of Growth Global homepage hero" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="School of Growth Global" />
    <meta
      name="twitter:description"
      content="Leadership, business transformation, mentorship, career growth, and lifelong learning for ambitious students, professionals, entrepreneurs, and executives."
    />
    <meta name="twitter:image" content="https://schoolofgrowthglobal.vercel.app/meta/og-home.png" />
    <title>School of Growth Global</title>
  </head>
  <body>
    <div id="root"></div>
    <template id="app-launch-template">
      <div id="app-launch-screen" role="status" aria-label="Loading School of Growth Global">
        <img src="/icons/sgg-launch-512-v1.png" width="512" height="512" alt="" fetchpriority="high" />
      </div>
    </template>
    <script id="app-launch-check">
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
        document.querySelector('meta[name="theme-color"]').content = '#000000';
        document.getElementById('root').append(document.getElementById('app-launch-template').content.cloneNode(true));
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
